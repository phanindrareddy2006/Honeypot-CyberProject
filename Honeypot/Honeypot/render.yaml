services:
  - type: web
    name: honeypot-backend
    runtime: java
    region: oregon
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/Honeypot-0.0.1-SNAPSHOT.jar
    preDeployCommand: ./mvnw clean package -DskipTests
    plan: free
    envVars:
      - key: JAVA_VERSION
        value: 17
      - key: DATABASE_URL
        fromDatabase:
          name: honeypot-db
          property: connectionString
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: honeypot-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: honeypot-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: honeypot-db
          property: password

databases:
  - name: honeypot-db
    databaseName: honeypot
    username: honeypot_user
    plan: free
